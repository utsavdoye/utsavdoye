<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Utsav Doye — Software Engineer, AI and ML">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1120"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#38BDF8" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1E293B" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.85" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#6366F1" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="card"><rect width="1200" height="300" rx="18"/></clipPath>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .in1 { opacity: 0; animation: up .8s ease-out .1s forwards; }
      .in2 { opacity: 0; animation: up .8s ease-out .35s forwards; }
      .in3 { opacity: 0; animation: up .8s ease-out .6s forwards; }
      .in4 { opacity: 0; animation: up .8s ease-out .85s forwards; }
      @keyframes up { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .sweep { animation: sweep 4.5s ease-in-out infinite; }
      @keyframes sweep { from { transform: translateX(-360px); } to { transform: translateX(1200px); } }
      .pulse { animation: pulse 2.2s ease-in-out infinite; transform-origin: 1032px 62px; }
      @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
      .node { animation: float 6s ease-in-out infinite; }
      .node.b { animation-delay: -2s; }
      .node.c { animation-delay: -4s; }
      @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
      .flow { stroke-dasharray: 4 8; animation: dash 1.6s linear infinite; }
      @keyframes dash { to { stroke-dashoffset: -24; } }
      @media (prefers-reduced-motion: reduce) {
        .in1,.in2,.in3,.in4 { opacity: 1; animation: none; }
        .cursor,.sweep,.pulse,.node,.flow { animation: none; }
      }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#grid)" opacity="0.55"/>
    <rect width="1200" height="300" fill="url(#glow)"/>

    <!-- status pill -->
    <g class="in1">
      <rect x="908" y="44" width="246" height="36" rx="18" fill="#0F172A" stroke="#1E3A5F"/>
      <circle class="pulse" cx="932" cy="62" r="5" fill="#22C55E"/>
      <text x="946" y="67" class="sans" font-size="14" fill="#CBD5E1">Open to internships · 2027</text>
    </g>

    <!-- name + role -->
    <text x="72" y="118" class="sans in1" font-size="60" font-weight="700" fill="#F8FAFC" letter-spacing="-1.5">Utsav Doye</text>
    <text x="74" y="160" class="sans in2" font-size="22" font-weight="500" fill="url(#accent)">Software Engineer · AI / ML</text>

    <!-- tagline -->
    <g class="in3">
      <text x="74" y="212" class="mono" font-size="17" fill="#94A3B8">
        <tspan fill="#38BDF8">›</tspan> I build AI products that real people use every day.<tspan class="cursor" fill="#38BDF8"> ▍</tspan>
      </text>
    </g>

    <!-- meta row -->
    <g class="in4 mono" font-size="14" fill="#64748B">
      <text x="74" y="252">Bengaluru, India</text>
      <text x="222" y="252" fill="#334155">/</text>
      <text x="242" y="252">B.Tech CSE (AI/ML) · 2029</text>
      <text x="470" y="252" fill="#334155">/</text>
      <text x="490" y="252">utsavdoye.com</text>
    </g>

    <!-- small pipeline graphic -->
    <svg x="850" y="132" width="320" height="120" overflow="visible"><g class="in4">
      <path class="flow" d="M44 46 H118" stroke="#38BDF8" stroke-width="2" fill="none"/>
      <path class="flow" d="M176 46 H250" stroke="#818CF8" stroke-width="2" fill="none"/>
      <g class="node"><rect x="0" y="24" width="44" height="44" rx="10" fill="#0F172A" stroke="#1E3A5F"/><text x="22" y="52" text-anchor="middle" class="mono" font-size="13" fill="#38BDF8">in</text></g>
      <g class="node b"><rect x="118" y="18" width="58" height="56" rx="12" fill="#111C33" stroke="#3B4A8A"/><text x="147" y="52" text-anchor="middle" class="mono" font-size="13" fill="#A5B4FC">AI</text></g>
      <g class="node c"><rect x="250" y="24" width="44" height="44" rx="10" fill="#0F172A" stroke="#1E3A5F"/><text x="272" y="52" text-anchor="middle" class="mono" font-size="13" fill="#22C55E">out</text></g>
      <text x="147" y="104" text-anchor="middle" class="mono" font-size="12" fill="#475569">voice · photos · sheets → working tools</text>
    </g></svg>

    <!-- bottom sheen line -->
    <rect x="0" y="298" width="1200" height="2" fill="#1E293B"/>
    <rect class="sweep" x="0" y="298" width="360" height="2" fill="url(#sheen)"/>
  </g>
</svg>

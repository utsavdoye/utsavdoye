name: Profile

# Rebuilds every panel in the README.
#   own scripts        -> assets/hero.svg (from profile.json), assets/habits.svg
#   lowlighter/metrics -> metrics/terminal.svg, metrics/stars.svg, metrics/reading.svg
#
# Needs one repo secret: METRICS_TOKEN (classic personal access token).

on:
  schedule:
    - cron: "23 20 * * *" # daily, 01:53 IST
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - profile.json
      - .github/scripts/**
      - .github/workflows/profile.yml

permissions:
  contents: write

concurrency:
  group: profile
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Hero panel (profile.json)
        run: node .github/scripts/hero.mjs

      - name: Habits panel (push events)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: node .github/scripts/habits.mjs

      - name: Commit own panels
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update hero and habits panels"
          git pull --rebase
          git push

      # lowlighter/metrics is pinned to the v3.34 commit (the same one @latest
      # points to) because it receives a token. Do not give these steps an
      # `id:` - the action reads its own step name to find its Docker image,
      # and an id makes it rebuild from source instead.

      - name: Live terminal (calendar + languages)
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics/terminal.svg
          template: terminal
          base: header
          config_timezone: Asia/Kolkata
          config_order: base.header, isocalendar, languages
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_languages: yes
          plugin_languages_limit: 6
          plugin_languages_ignored: html, css

      - name: Recently starred repositories
        if: ${{ !cancelled() }}
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics/stars.svg
          base: ""
          config_timezone: Asia/Kolkata
          plugin_stars: yes
          plugin_stars_limit: 4

      # These two read public GitHub pages, so they run without the token.
      - name: Starred topics + star lists
        if: ${{ !cancelled() }}
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          token: NOT_NEEDED
          user: utsavdoye
          filename: metrics/reading.svg
          base: ""
          config_timezone: Asia/Kolkata
          plugin_topics: yes
          plugin_topics_mode: icons
          plugin_topics_limit: 20
          plugin_starlists: yes
          plugin_starlists_limit: 3
          plugin_starlists_limit_repositories: 2
          plugin_starlists_languages: yes
          plugin_starlists_limit_languages: 6
          plugin_starlists_shuffle_repositories: no
